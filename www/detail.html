<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>商品详情 · 简物</title>
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/shop.css">
</head>
<body>

<header class="topbar">
    <div class="topbar-inner">
        <a class="brand" href="/search.html">简<span>物</span></a>
        <nav class="nav">
            <a class="navlink" href="/search.html">搜索</a>
            <a class="navlink" href="/shop.html">购物车 / 订单</a>
        </nav>
        <div class="topbar-right">
            <span id="user-nick"></span>
            <button class="btn btn-ghost btn-sm" id="logout-btn">退出</button>
        </div>
    </div>
</header>

<main class="wrap">
    <div class="crumb">
        <a href="/search.html">搜索</a><span>/</span>
        <a id="crumb-back" href="/results.html">结果</a><span>/</span>
        <span id="crumb-name" style="color:var(--ink)">商品详情</span>
    </div>

    <div id="detail-box">
        <div class="empty"><div class="big">⏳</div>正在加载…</div>
    </div>

    <div class="desc hidden" id="desc-box">
        <h2>商品详情</h2>
        <div id="desc-body"></div>
    </div>
</main>

<div class="toast" id="toast"></div>

<script>
(function () {
    'use strict';

    var $ = function (id) { return document.getElementById(id); };

    var id = parseInt(new URLSearchParams(location.search).get('id') || '0', 10);

    var state = { product: null, qty: 1 };

    var toastTimer = null;
    function toast(text) {
        var el = $('toast');
        el.textContent = text;
        el.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () { el.classList.remove('show'); }, 1800);
    }

    async function apiGet(path) {
        var res = await fetch(path, { credentials: 'same-origin' });
        return res.json();
    }

    async function apiPost(path, body) {
        var res = await fetch(path, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'same-origin',
            body: JSON.stringify(body || {})
        });
        return res.json();
    }

    function esc(s) {
        return String(s == null ? '' : s)
            .replace(/&/g, '&amp;').replace(/</g, '&lt;')
            .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function money(cents) {
        return (cents / 100).toFixed(2);
    }

    /* 详情页正文通常是长文本，按句子切成几段，读起来不累 */
    function paragraphs(text) {
        if (!text) return '';

        var sentences = String(text).split('。').map(function (s) { return s.trim(); })
            .filter(function (s) { return s.length; });

        var chunks = [];
        for (var i = 0; i < sentences.length; i += 3) {
            chunks.push(sentences.slice(i, i + 3).join('。') + '。');
        }

        return chunks.map(function (c) { return '<p>' + esc(c) + '</p>'; }).join('');
    }

    /* ---------------- 渲染 ---------------- */
    function render(p) {
        var imgs = (p.images && p.images.length) ? p.images.slice() : [];
        if (!imgs.length) {
            if (p.image) imgs.push(p.image);
            else if (p.thumb) imgs.push(p.thumb);
        }

        var main = imgs.length ? imgs[0] : '';
        var sold = p.stock <= 0;
        var meta = [p.brand, p.category].filter(Boolean).join(' · ');

        var mainHtml = main
            ? '<img id="main-img" src="' + esc(main) + '" alt="" ' +
              'onerror="this.parentNode.innerHTML=\'<div class=\\\'noimg\\\'>暂无图片</div>\'">'
            : '<div class="noimg">暂无图片</div>';

        var thumbs = imgs.length > 1
            ? '<div class="thumbs">' + imgs.map(function (u, i) {
                  return '<img src="' + esc(u) + '" data-i="' + i + '"' +
                         (i === 0 ? ' class="active"' : '') + ' alt="" ' +
                         'onerror="this.style.display=\'none\'">';
              }).join('') + '</div>'
            : '';

        var oldPrice = (p.market_price && p.market_price > p.price)
            ? '<span class="old">¥' + money(p.market_price) + '</span>' +
              '<span class="save">比市场价省 ¥' + money(p.market_price - p.price) + '</span>'
            : '';

        $('detail-box').innerHTML =
            '<div class="detail">' +
                '<div>' +
                    '<div class="detail-pic">' + mainHtml + '</div>' +
                    thumbs +
                '</div>' +
                '<div class="detail-main">' +
                    '<h1 class="title">' + esc(p.name) + '</h1>' +
                    '<p class="brief">' + esc(p.subtitle || meta || '') + '</p>' +

                    '<div class="pricebox">' +
                        '<span class="now">' + money(p.price) + '</span>' +
                        oldPrice +
                    '</div>' +

                    '<table class="attr">' +
                        '<tr><td>品牌</td><td>' + esc(p.brand || '—') + '</td></tr>' +
                        '<tr><td>分类</td><td>' + esc(p.category || '—') + '</td></tr>' +
                        '<tr><td>商品编号</td><td>' + esc(p.sn || '—') + '</td></tr>' +
                        '<tr><td>浏览</td><td>' + (p.clicks || 0) + ' 次</td></tr>' +
                    '</table>' +

                    '<div class="stock-line">库存 <b>' + p.stock + '</b> 件' +
                        (sold ? ' <span class="out">（已售罄）</span>' : '') + '</div>' +

                    '<div class="buybar">' +
                        '<div class="qty">' +
                            '<button id="qty-dec">−</button>' +
                            '<span id="qty-num">1</span>' +
                            '<button id="qty-inc">+</button>' +
                        '</div>' +
                        '<button class="btn" id="add-cart"' + (sold ? ' disabled' : '') + '>加入购物车</button>' +
                        '<a class="btn btn-ghost" href="/shop.html">去购物车</a>' +
                    '</div>' +
                '</div>' +
            '</div>';

        $('crumb-name').textContent = p.name;
        $('crumb-back').href = '/results.html' +
            (p.category ? '?cat=' + encodeURIComponent(p.category) : '');

        /* 图集切换 */
        document.querySelectorAll('.thumbs img').forEach(function (t) {
            t.addEventListener('click', function () {
                var i = parseInt(t.dataset.i, 10);

                document.querySelectorAll('.thumbs img').forEach(function (x) {
                    x.classList.remove('active');
                });
                t.classList.add('active');

                var box = document.querySelector('.detail-pic');
                box.innerHTML = '<img id="main-img" src="' + esc(imgs[i]) + '" alt="">';
            });
        });

        /* 数量加减 */
        var qtyNum = $('qty-num');

        function setQty(n) {
            if (n < 1) n = 1;
            if (p.stock > 0 && n > p.stock) n = p.stock;
            state.qty = n;
            qtyNum.textContent = n;
        }

        $('qty-dec').addEventListener('click', function () { setQty(state.qty - 1); });
        $('qty-inc').addEventListener('click', function () { setQty(state.qty + 1); });

        $('add-cart').addEventListener('click', async function () {
            var btn = $('add-cart');
            btn.disabled = true;

            var r = await apiPost('/api/cart/add', { product_id: p.id, qty: state.qty });

            if (r.code === 0) toast('已加入购物车 ' + state.qty + ' 件');
            else if (r.code === 401) { location.href = '/'; return; }
            else toast(r.msg || '操作失败');

            btn.disabled = false;
        });

        /* 详情正文 */
        if (p.description) {
            $('desc-body').innerHTML = paragraphs(p.description);
            $('desc-box').classList.remove('hidden');
        }

        document.title = p.name + ' · 简物';
    }

    /* ---------------- 启动 ---------------- */
    (async function boot() {
        var me = await apiGet('/api/me');

        if (me.code !== 0) { location.href = '/'; return; }

        $('user-nick').textContent = me.data.nickname || me.data.account;

        $('logout-btn').addEventListener('click', async function () {
            await apiPost('/api/logout', {});
            location.href = '/';
        });

        if (!id) {
            $('detail-box').innerHTML =
                '<div class="empty"><div class="big">🤔</div>没有指定商品' +
                '<div style="margin-top:16px"><a class="btn btn-ghost btn-sm" href="/search.html">去搜索</a></div></div>';
            return;
        }

        var r = await apiGet('/api/product?id=' + id);

        if (r.code !== 0 || !r.data) {
            $('detail-box').innerHTML =
                '<div class="empty"><div class="big">🤔</div>' + esc(r.msg || '商品不存在') +
                '<div style="margin-top:16px"><a class="btn btn-ghost btn-sm" href="/results.html">返回列表</a></div></div>';
            return;
        }

        state.product = r.data;
        render(r.data);
    })();
})();
</script>
</body>
</html>
